# Dependabot configuration
# Cooldown delays updating normal npm dependencies by 7 days but allows security updates to be processed immediately.
# Note: Cooldown is not supported for the github-actions ecosystem.
# Reference: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'cron'
      cron: '17 3 * * 2'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 15
    cooldown:
      default: 7
    assignees:
      - 'backfisch88'
    versioning-strategy: 'increase'
    ignore:
      # Major updates of @types/node must match the minimum supported Node.js (22); never bump automatically.
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
      # TypeScript 7 is not yet supported by typescript-eslint.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'cron'
      cron: '32 3 * * 2'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 15
    assignees:
      - 'backfisch88'
