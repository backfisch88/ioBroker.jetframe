# Dependabot will run on day 13 of each month at 03:43 (Europe/Berlin timezone)
version: 2
updates:

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'cron'
      cron: '17 3 * * 2'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 15
    cooldown:
      default-days: 7
    assignees:
      - 'backfisch88'
    versioning-strategy: 'increase'
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'cron'
      cron: '32 3 * * 2'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 15
    cooldown:
      default: 7
    assignees:
      - 'backfisch88'
