# Automatically merge Dependabot PRs once checks pass, using the official
# ioBroker bot-orga action (the previously used ahmadnassri action no longer works).

name: Auto-merge Dependabot PRs

on:
    # WARNING: This needs to be run in the PR base, DO NOT build untrusted code in this action
    # details under https://github.blog/changelog/2021-02-19-github-actions-workflows-triggered-by-dependabot-prs-will-run-with-read-only-permissions/
    pull_request_target:

permissions:
    contents: write
    pull-requests: write

jobs:
    automerge:
        if: github.actor == 'dependabot[bot]'
        runs-on: ubuntu-latest
        steps:
            - uses: iobroker-bot-orga/action-automerge-dependabot@v1
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
